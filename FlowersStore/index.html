<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Flower's Store - Promoções</title>
</head>
<body>
    <!-- CABEÇALHO -->
    <header>
        <div class="logo-container">
            <img class="logo logo-circular" src="imagens/logo-flowers-store.jpg" alt="Logo Flower's Store Esquerda">
            <h1 class="titulo-loja">Flower's Store</h1>
            <img class="logo logo-circular" src="imagens/logo-flowers-store.jpg" alt="Logo Flower's Store Direita">
        </div>
    </header>

    <!-- MENU DE NAVEGAÇÃO PARA PÁGINAS INDIVIDUAIS -->
    <nav class="navegacao-principal">
        <a href="index.html" class="active">Promoções da Semana</a>
        <a href="produtos.html">Produtos</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>
        <!-- APENAS PROMOÇÕES DA SEMANA -->
        <section id="promocoes" class="promocoes">
            <h2>Promoções da Semana</h2>
            <div class="grade-produtos-geral">
                <article class="produto produto-promocao">
                    <span class="tag-desconto">-20%</span>
                    <img class="fotos" src="imagens/vestido-longo-azul.png" alt="Vestido Longo Azul Floral">
                    <h3>Vestido Longo Azul Floral</h3>
                    <p class="preco">R$ 119,99</p>
                    <button type="button">Comprar</button>
                </article>
                <article class="produto produto-promocao">
                    <span class="tag-desconto">-20%</span>
                    <img class="fotos" src="imagens/bermuda-clara.png" alt="Bermuda Lavagem Clara">
                    <h3>Bermuda Jeans Clara</h3>
                    <p class="preco">R$ 59,90</p>
                    <button type="button">Comprar</button>
                </article>
                <article class="produto produto-promocao">
                    <span class="tag-desconto">-20%</span>
                    <img class="fotos" src="imagens/bermuda-escura.png" alt="Bermuda Lavagem Escura">
                    <h3>Bermuda Jeans Escura</h3>
                    <p class="preco">R$ 59,99</p>
                    <button type="button">Comprar</button>
                </article>
            </div>
        </section>
    </main>

    <!-- RODAPÉ -->
    <footer class="rodape">
        <p>&copy; 2026 - Todos os direitos reservados</p>
    </footer>
</body>
</html>
