<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Flower's Store - Produtos</title>
</head>
<body>
    <header>
        <div class="logo-container">
            <img class="logo logo-circular" src="imagens/logo-flowers-store.jpg" alt="Logo Flower's Store Esquerda">
            <h1 class="titulo-loja">Flower's Store</h1>
            <img class="logo logo-circular" src="imagens/logo-flowers-store.jpg" alt="Logo Flower's Store Direita">
        </div>
    </header>

    <nav class="navegacao-principal">
        <a href="index.html" class="active">Promoções da Semana</a>
        <a href="produtos.html">Produtos</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>
        <section class="produtos">
            <h2>Produtos</h2>
            <br>

            <h3>Categoria: Vestidos</h3>
            <div class="grade-produtos-geral">
                <article class="produto">
                    <img class="fotos" src="imagens/vestido-longo-azul.png" alt="Vestido Longo Azul Floral">
                    <h3>Vestido Longo Azul Floral</h3>
                    <p class="preco">R$ 149,99</p>
                    <button type="button">Comprar</button>
                </article>
                <article class="produto">
                    <img class="fotos" src="imagens/vestido-longo-colorido.png" alt="Vestido Longo Colorido">
                    <h3>Vestido Longo Colorido</h3>
                    <p class="preco">R$ 139,90</p>
                    <button type="button">Comprar</button>
                </article>
                <article class="produto">
                    <img class="fotos" src="imagens/vestido-longo-verde.png" alt="Vestido Longo Verde">
                    <h3>Vestido Longo Verde</h3>
                    <p class="preco">R$ 129,90</p>
                    <button type="button">Comprar</button>
                </article>
                
            </div>
        </section>
    </main>
</body>
</html>
