<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Flower's Store - Promoção</title>
  </head>

  <body>
    <!-- CABEÇALHO -->
    <header>
      <div class="logo-container">
        <img
          class="logo logo-circular"
          src="imagens/logo-flowers-store.jpg"
          alt="Logo Flower's Store Esquerda"
        />
        <h1 class="titulo-loja">Flower's Store</h1>
        <img
          class="logo logo-circular"
          src="imagens/logo-flowers-store.jpg"
          alt="Logo Flower's Store Direita"
        />
      </div>
    </header>

    <!-- NAVEGAÇÃO GLOBAL -->
    <nav class="navegacao-principal">
        <a href="index.html" class="active">Promoções da Semana</a>
        <a href="produtos.html">Produtos</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
    </nav>

    <!-- CONTEÚDO EXCLUSIVO DA HOME -->
    <main class="pagina-home">
      
        <h2>Promoções da Semana</h2>
        
        <section class="grade-produtos-geral">
            <article class="produto produto-promocao">
                <span class="tag-desconto">-30%</span>
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500&auto=format&fit=crop&q=80" alt="Vestido de Seda Floral" class="fotos">
                <h3>Vestido Elegance Floral</h3>
                <p class="preco">R$ 189,90</p>
                <button type="button">Comprar Agora</button>
            </article>

            <article class="produto produto-promocao">
                <span class="tag-desconto">-20%</span>
                <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=500&auto=format&fit=crop&q=80" alt="Jaqueta Jeans Premium" class="fotos">
                <h3>Jaqueta Jeans Premium</h3>
                <p class="preco">R$ 219,90</p>
                <button type="button">Comprar Agora</button>
            </article>

            <article class="produto produto-promocao">
                <span class="tag-desconto">-40%</span>
                <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=500&auto=format&fit=crop&q=80" alt="Sobretudo de Lã" class="fotos">
                <h3>Sobretudo Clássico</h3>
                <p class="preco">R$ 299,90</p>
                <button type="button">Comprar Agora</button>
            </article>
        </section>
    </main>

    <footer class="rodape">

    </footer>
